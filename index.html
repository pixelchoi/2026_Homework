<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bible Dashboard</title>
    <!-- 아이콘 미노출 방지용 외부 폰트/아이콘 CDN -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a6fa5;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-align: center;
        }

        /* 격자 레이아웃 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 800px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 카드 스타일 */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
            background-color: #fafbfc;
        }

        /* 로고 이미지 및 아이콘 크기 규격화 */
        .logo-img {
            width: 64px;
            height: 64px;
            margin-bottom: 15px;
            object-fit: contain;
            border-radius: 8px;
        }

        /* PDF 아이콘 스타일 */
        .pdf-icon {
            font-size: 64px;
            margin-bottom: 15px;
            color: #dc3545;
        }

        .card h2 {
            margin: 10px 0 5px 0;
            font-size: 1.3rem;
        }

        .card p {
            margin: 0;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <h1>📖 My Bible Dashboard</h1>

    <div class="dashboard-grid">
        
        <!-- 1. BibleGateway (공식 Favicon 이미지 적용) -->
        <a href="https://biblegateway.com" target="_blank" class="card">
            <img src="https://biblegateway.comfavicon.ico" onerror="this.src='https://icons8.com'" class="logo-img" alt="BibleGateway">
            <h2>BibleGateway</h2>
            <p>다양한 번역본 및 검색</p>
        </a>

        <!-- 2. 대한성서공회 (공식 로고 추출 및 대체 아이콘 설정) -->
        <a href="https://bskorea.or.kr" target="_blank" class="card">
            <img src="https://bskorea.or.kr" onerror="this.src='https://icons8.com'" class="logo-img" alt="대한성서공회">
            <h2>대한성서공회</h2>
            <p>개역개정 창세기 1:1 바로 읽기</p>
        </a>

        <!-- 3. Our Daily Bread (ODB 공식 앱 로고 적용) -->
        <a href="https://odb.org" target="_blank" class="card">
            <img src="https://odb.org" onerror="this.src='https://icons8.com'" class="logo-img" alt="ODB">
            <h2>Our Daily Bread</h2>
            <p>매일의 양식 묵상 (ODB)</p>
        </a>

        <!-- 4. 내가 설정한 PDF 자료 (고화질 PDF 아이콘 적용) -->
        <a href="sat-vocabulary.pdf" target="_blank" class="card">
            <i class="fa-solid fa-file-pdf pdf-icon"></i>
            <h2>개인 성경 자료 (PDF)</h2>
            <p>SAT Vocabulary 연구 노트</p>
        </a>

    </div>

</body>
</html>
