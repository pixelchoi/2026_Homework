<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bible Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a6fa5;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-align: center;
        }

        /* 2x2 격자 레이아웃 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 800px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 카드 스타일 */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
            background-color: #fafbfc;
        }

        /* 깨지지 않는 선명한 대시보드 전용 이모지 아이콘 스타일 */
        .emoji-icon {
            font-size: 55px;
            margin-bottom: 15px;
            line-height: 1;
        }

        .card h2 {
            margin: 10px 0 5px 0;
            font-size: 1.3rem;
        }

        .card p {
            margin: 0;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <h1>📘 My Bible Dashboard</h1>

    <div class="dashboard-grid">
        
        <!-- 1. BibleGateway -->
        <a href="https://biblegateway.com" target="_blank" class="card">
            <div class="emoji-icon">✝️</div>
            <h2>BibleGateway</h2>
            <p>다양한 번역본 및 검색</p>
        </a>

        <!-- 2. 대한성서공회 (요청하신 창세기 1:1 주소 원본 반영) -->
        <a href="https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=gen&chap=1&sec=1&cVersion=&fontSize=15px&fontWeight=normal" target="_blank" class="card">
            <div class="emoji-icon">⛪</div>
            <h2>대한성서공회</h2>
            <p>개역개정 창세기 1:1 바로 읽기</p>
        </a>

        <!-- 3. Our Daily Bread -->
        <a href="https://odb.org" target="_blank" class="card">
            <div class="emoji-icon">🌾</div>
            <h2>Our Daily Bread</h2>
            <p>매일의 양식 묵상 (ODB)</p>
        </a>

        <!-- 4. 개인 설정 PDF (보내주신 구글 드라이브 PDF 전용 주소 연동 완료) -->
        <a href="https://drive.google.com/file/d/1MElKrPy0srBAPMnru9AzA8a0eMUQVIsR/view?usp=sharing" target="_blank" class="card">
            <div class="emoji-icon">📁</div>
            <h2>개인 성경 자료 (PDF)</h2>
            <p>구글 드라이브 / 웹에서 열기</p>
        </a>

    </div>

</body>
</html>
